[project]
name = "ons-carga-forecast"
version = "0.1.0"
description = "Previsão de carga de energia diária (7 dias) do subsistema SE usando dados abertos do ONS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.8.0",
    "duckdb>=1.1.0",
    "holidays>=0.60",
    "lightgbm>=4.5.0",
    "mlflow>=2.17.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ons_forecast"]
