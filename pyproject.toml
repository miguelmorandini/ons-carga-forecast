[project]
name = "ons-carga-forecast"
version = "0.1.0"
description = "Previsão de carga de energia diária (7 dias) do subsistema SE usando dados abertos do ONS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
pipeline = [
    "dbt-duckdb>=1.8.0",
    "holidays>=0.60",
    "lightgbm>=4.5.0",
    "mlflow>=2.17.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "statsforecast>=2.0.0",
]

[project.scripts]
ons-pipeline = "ons_forecast.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ons_forecast"]
